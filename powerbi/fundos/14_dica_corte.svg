<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect x="0" y="0" width="400" height="300" fill="#FBFAF7"/><rect x="0" y="0" width="400" height="5" fill="#1F3A5F"/><text x="20" y="36" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">De onde vem o corte da percepção</text><rect x="20" y="58" width="360" height="1" fill="#DAD4C8"/><text x="20" y="80" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Percentis 25 e 75 do rating desta base: abaixo é nota &lt;= 3,90 e acima é</text><text x="20" y="95" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">nota &gt;= 4,30. Um corte fixo em 3,0 marcaria só 6 produtos de 1.351,</text><text x="20" y="110" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">porque a nota é comprimida.</text><text x="20" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2E6BA8" text-anchor="start" opacity="1.0">ACIMA DA BASE</text><rect x="18" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><text x="208" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#A6824C" text-anchor="start" opacity="1.0">ABAIXO DA BASE</text><rect x="206" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><rect x="20" y="240" width="360" height="1" fill="#DAD4C8"/><text x="20" y="262" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">o corte é da base inteira: o filtro de categoria muda a contagem, não o corte</text></svg>