acity="1.0">O que separa quem reclama de quem elogia</text><text x="280" y="384" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">os 8 termos de cada lado com maior diferença. Comparação da base inteira: não acompanha os filtros</text><rect x="1109.8" y="348" width="82.8" height="22" rx="11" fill="#E7E2D9" stroke="#A6824C"/><text x="1121.8" y="363" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#A6824C" text-anchor="start" opacity="1.0">dica: o termo</text><rect x="1226.56" y="334" width="665.44" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1246.56" y="366" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Elogio: o que mais aparece</text><text x="1246.56" y="384" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">os 15 de maior peso acima da base. Calculado na base inteira: não acompanha os filtros</text><rect x="1226.56" y="694" width="665.44" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1246.56" y="726" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Reclamação: o que mais aparece</text><text x="1246.56" y="744" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">os 15 de maior peso abaixo da base. Calculado na base inteira: não acompanha os filtros</text><text x="260" y="1062" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">Fonte: Amazon Sales Dataset (Kaggle) · 1.351 produtos, 10.598 avaliações com texto · valores em rupia indiana, convertidos pela segmentação de moeda</