t-anchor="middle" opacity="1.0">voltar para a visão</text><rect x="260" y="150" width="806.0" height="884" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="280" y="182" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Muito avaliado, nota baixa</text><text x="280" y="200" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">nº de avaliações acima da mediana da base e nota no quartil inferior</text><rect x="1086.0" y="150" width="806.0" height="884" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1106.0" y="182" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Nota alta, pouco visto</text><text x="1106.0" y="200" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">nota no quartil superior e menos de mil avaliações</text><text x="260" y="1062" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">Os dois cortes vêm da distribuição desta base, não de número redondo. Mediana de avaliações: 4.740. Quartis de nota: 3,90 e 4,30.</text></svg>