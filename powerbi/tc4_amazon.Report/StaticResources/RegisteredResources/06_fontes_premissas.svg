<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#E7E2D9"/><rect x="0" y="0" width="232" height="1080" fill="#1F3A5F"/><rect x="24" y="30" width="4" height="30" rx="2" fill="#A6824C"/><text x="40" y="46" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1.0">Amazon</text><text x="40" y="62" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="0.75">Portfólio e cliente</text><g transform="translate(30,127) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 H21 M7 21 V12 M12 21 V5 M17 21 V15"/></g><text x="66" y="145" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Visão executiva</text><g transform="translate(30,179) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4 H10 V11 H3 Z M14 4 H21 V11 H14 Z M3 14 H10 V21 H3 Z M14 14 H21 V21 H14 Z"/></g><text x="66" y="197" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Produtos e categorias</text><g transform="translate(30,231) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 H13 L3 14 L10 21 L20 11 Z M16.2 8.2 L16.3 8.3"/></g><text x="66" y="249" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Preços e descontos</text><g transform="translate(30,283) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5 H20 V16 H12 L7 20 V16 H4 Z M8 10 H16 M8 13 H13"/></g><text x="66" y="301" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Customer insights</text><g transform="translate(30,335) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L5 13 H11 L10 22 L19 10 H13 Z"/></g><text x="66" y="353" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Recomendações</text><rect x="12" y="376" width="208" height="46" rx="8" fill="#2E4E78"/><rect x="12" y="387" width="3" height="24" rx="1.5" fill="#A6824C"/><g transform="translate(30,387) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 H15 L19 7 V21 H6 Z M15 3 V7 H19 M9 12 H16 M9 16 H16"/></g><text x="66" y="405" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="1.0">Fontes e premissas</text><rect x="232" y="0" width="1688" height="104" fill="#FBFAF7"/><rect x="232" y="103" width="1688" height="1" fill="#DAD4C8"/><text x="260" y="46" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F" text-anchor="start" opacity="1.0">Fontes e premissas</text><text x="260" y="72" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">De onde veio cada número e o que foi assumido</text><rect x="1688.6" y="34" width="203.4" height="30" rx="15" fill="#E7E2D9" stroke="#DAD4C8"/><text x="1790.3" y="54" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#5C5A54" text-anchor="middle" opacity="1.0">3 premissas · 4 limites · 4 tratamentos</text><rect x="260" y="150" width="806.0" height="394" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="284" y="184" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">As premissas declaradas</text><text x="284" y="204" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">sem elas, três números desta análise não se sustentam</text><rect x="284" y="220" width="758.0" height="1" fill="#DAD4C8"/><rect x="284" y="240" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="252" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Taxa de câmbio</text><text x="298" y="274" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">A base só traz rupia indiana e não traz cotação. Toda conversão é assumida, com a data ao lado na tabela dMoeda.</text><rect x="284" y="354.5" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="366.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Corte de percepção</text><text x="298" y="388.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Percentis 25 e 75 do rating desta base: abaixo &lt;= 3,90 e acima &gt;= 4,30. Corte fixo em 3,0 marcaria 6 produtos de 1.351.</text><rect x="284" y="469.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="481.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">rating_count é proxy</text><text x="298" y="503.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">A base não traz volume vendido. rating_count mede engajamento, não venda. Conclusão sobre receita é inferência.</text><rect x="260" y="564" width="806.0" height="470" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="284" y="598" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">O que a base não mede</text><text x="284" y="618" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">limites que precisam ser ditos antes da conclusão</text><rect x="284" y="634" width="758.0" height="1" fill="#DAD4C8"/><rect x="284" y="654" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="666" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Amostra</text><text x="298" y="688" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">A base cobre um recorte do catálogo da Amazon na Índia, não o catálogo inteiro nem outro país.</text><rect x="284" y="750.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="762.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Concentração</text><text x="298" y="784.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">97,2% dos produtos estão em três categorias. Conclusão sobre categoria pequena não tem amostra que sustente.</text><rect x="284" y="846.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="858.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Nota comprimida</text><text x="298" y="880.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">O rating vai de 2,0 a 5,0 com mediana 4,10. Não existe produto mal avaliado em termos absolutos nesta base.</text><rect x="284" y="942.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="298" y="954.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Texto da avaliação</text><text x="298" y="976.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">review_title e review_content vêm colados por vírgula e o texto tem vírgula dentro. A contagem sai do review_id; o texto fica agregado</text><text x="298" y="993.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">por produto.</text><rect x="1086.0" y="150" width="806.0" height="470" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1110.0" y="184" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">O caminho do dado</text><text x="1110.0" y="204" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">da linha baixada no Kaggle até a tabela do modelo</text><rect x="1110.0" y="220" width="758.0" height="1" fill="#DAD4C8"/><rect x="1126.0" y="248" width="726.0" height="66" rx="8" fill="#E7E2D9"/><rect x="1126.0" y="262" width="3" height="38" rx="1.5" fill="#A6824C"/><circle cx="1166.0" cy="281.0" r="15" fill="#1F3A5F"/><text x="1166.0" y="286.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">1</text><text x="1196.0" y="274" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Origem</text><text x="1196.0" y="292" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Amazon Sales Dataset no Kaggle: 1.465 linhas, 16 colunas, preços em texto com o símbolo da rupia.</text><path d="M1166.0 317 V334.33" stroke="#A6824C" stroke-width="2" fill="none"/><path d="M1162.0 330.33 L1166.0 336.33 L1170.0 330.33" stroke="#A6824C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1126.0" y="341.3333333333333" width="726.0" height="66" rx="8" fill="#E7E2D9"/><rect x="1126.0" y="355.33" width="3" height="38" rx="1.5" fill="#A6824C"/><circle cx="1166.0" cy="374.33" r="15" fill="#1F3A5F"/><text x="1166.0" y="379.33" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">2</text><text x="1196.0" y="367.3333333333333" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Limpeza</text><text x="1196.0" y="385.3333333333333" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Tipagem com cultura en-US, símbolo e separador de milhar removidos, percentual convertido em proporção.</text><path d="M1166.0 410.33 V427.67" stroke="#A6824C" stroke-width="2" fill="none"/><path d="M1162.0 423.67 L1166.0 429.67 L1170.0 423.67" stroke="#A6824C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1126.0" y="434.66666666666663" width="726.0" height="66" rx="8" fill="#E7E2D9"/><rect x="1126.0" y="448.67" width="3" height="38" rx="1.5" fill="#A6824C"/><circle cx="1166.0" cy="467.67" r="15" fill="#1F3A5F"/><text x="1166.0" y="472.67" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">3</text><text x="1196.0" y="460.66666666666663" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Consolidação</text><text x="1196.0" y="478.66666666666663" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">92 IDs repetidos resolvidos por desempate: menos nulos vence, empate decide pelo maior rating_count. Sobram 1.351 produtos.</text><path d="M1166.0 503.67 V521.0" stroke="#A6824C" stroke-width="2" fill="none"/><path d="M1162.0 517.0 L1166.0 523.0 L1170.0 517.0" stroke="#A6824C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1126.0" y="528.0" width="726.0" height="66" rx="8" fill="#E7E2D9"/><rect x="1126.0" y="542.0" width="3" height="38" rx="1.5" fill="#A6824C"/><circle cx="1166.0" cy="561.0" r="15" fill="#1F3A5F"/><text x="1166.0" y="566.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">4</text><text x="1196.0" y="554.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Modelagem</text><text x="1196.0" y="572.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Star schema: fProdutos no grão de produto, dCategoria com a hierarquia em colunas, fAvaliacoes e as tabelas de termos.</text><rect x="1086.0" y="640" width="806.0" height="394" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1110.0" y="674" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Tratamentos aplicados</text><text x="1110.0" y="694" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">consolidação de IDs, hierarquia e extração de termos</text><rect x="1110.0" y="710" width="758.0" height="1" fill="#DAD4C8"/><rect x="1110.0" y="730" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="1124.0" y="742" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Categoria</text><text x="1124.0" y="764" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">O campo é uma hierarquia separada por barra vertical, não uma lista. Virou coluna por nível, até 7. Explodir em linha inflaria toda soma</text><text x="1124.0" y="781" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">em 4,2 vezes.</text><rect x="1110.0" y="812.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="1124.0" y="824.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Chave da avaliação</text><text x="1124.0" y="846.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">review_id não é chave: 759 ids aparecem em produtos diferentes. A tabela usa sk_avaliacao como chave substituta.</text><rect x="1110.0" y="877.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="1124.0" y="889.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Termos</text><text x="1124.0" y="911.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Stopwords em inglês mais os genéricos do domínio. Termo presente em só uma faixa costuma ser nome de marca, então a comparação</text><text x="1124.0" y="928.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">usa só os presentes nas duas.</text><rect x="1110.0" y="959.0" width="3" height="15" rx="1.5" fill="#A6824C"/><text x="1124.0" y="971.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Moeda</text><text x="1124.0" y="993.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">dMoeda é tabela desconectada. Alimenta a segmentação e as medidas por SELECTEDVALUE, não filtra o fato.</text><text x="260" y="1062" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">Fonte: Amazon Sales Dataset (Kaggle) · 1.351 produtos, 10.598 avaliações com texto · valores em rupia indiana, convertidos pela segmentação de moeda</text></svg>