="262.0" y="122" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">CATEGORIA</text><rect x="260.0" y="128" width="290.4" height="42" rx="8" fill="#FBFAF7" stroke="#DAD4C8"/><text x="566.4" y="122" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">FAIXA DE PREÇO</text><rect x="564.4" y="128" width="290.4" height="42" rx="8" fill="#FBFAF7" stroke="#DAD4C8"/><text x="870.8" y="122" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">FAIXA DE NOTA</text><rect x="868.8" y="128" width="290.4" height="42" rx="8" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1175.1999999999998" y="122" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">MOEDA</text><rect x="1173.2" y="128" width="290.4" height="42" rx="8" fill="#FBFAF7" stroke="#DAD4C8"/><rect x="1782" y="128" width="110" height="42" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="1837" y="154" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">Limpar filtros</text><rect x="260.0" y="210" width="393.0" height="104" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="316.0" y="244" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="start" opacity="1.0">Produtos no portfólio</text><text x="282.0" y="300" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">após consolidar IDs repetidos</text><rect x="673.0" y="210" width="393.0" height="104" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="729.0" y="244" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="start" opacity="1.0">Avaliações declaradas</text><text x="695.0" y="300" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">rating_count somado</text><rect x="966.0" y="224" width="99.6" height="22" rx="11" fill="#E7E2D9" stroke="#A6824C"/><text x="978.0" y="239" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#A6824C" text-anchor="start" opacity="1.0">dica: o que mede</text><rect x="1086.0" y="210" width="393.0" height="104" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1142.0" y="244" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="start" opacity="1.0">Nota média ponderada</text><text x="1108.0" y="300" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">ponderada por nº de avaliações</text><rect x="1379.0" y="224" width="99.6" height="22" rx="11" fill="#E7E2D9" stroke="#A6824C"/><text x="1391.0" y="239" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#A6824C" text-anchor="start" opacity="1.0">dica: ponderação</text><rect x="1499.0" y="210" width="393.0" height="104" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1555.0" y="244" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="start" opacity="1.0">Desconto médio</text><text x="1521.0" y="300" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">média simples do percentual</text><rect x="260" y="334" width="946.56" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="280" y="366" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">O portfólio é de eletrônicos, não um catálogo diverso</text><text x="280" y="384" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">nº de produtos por categoria de nível 1</text><rect x="260" y="694" width="946.56" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="280" y="726" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">E a atenção do cliente segue a mesma concentração</text><text x="280" y="744" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">nº de avaliações por categoria de nível 1, escala própria</text><rect x="1226.56" y="334" width="665.44" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1246.56" y="366" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Onde a nota se concentra</text><text x="1246.56" y="384" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">produtos por faixa de nota, de 2,0 a 5,0</text><rect x="1226.56" y="694" width="665.44" height="340" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><text x="1246.56" y="726" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Dois bolsos de oportunidade</text><text x="1246.56" y="744" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">produtos que já têm tráfego, e produtos que mereciam ter</text><rect x="1784.0" y="708" width="94.0" height="22" rx="11" fill="#E7E2D9" stroke="#A6824C"/><text x="1796.0" y="723" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="600" fill="#A6824C" text-anchor="start" opacity="1.0">ver os produtos</text><rect x="1559.3" y="778" width="1" height="220" fill="#DAD4C8"/><text x="1396.9" y="804" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="middle" opacity="1.0">Muito avaliado, nota baixa</text><text x="1396.9" y="980" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="middle" opacity="1.0">avaliações acima da mediana</text><text x="1396.9" y="996" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="middle" opacity="1.0">e nota no quartil inferior</text><text x="1721.6" y="804" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5C5A54" text-anchor="middle" opacity="1.0">Nota alta, pouco visto</text><text x="1721.6" y="980" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="middle" opacity="1.0">nota no quartil superior</text><text x="1721.6" y="996" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="middle" opacity="1.0">e menos de mil avaliações</text><text x="260" y="1062" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">Fonte: Amazon Sales Dataset (Kaggle) · 1.351 produtos, 10.598 avaliações com texto · valores em rupia indiana, convertidos pela segmentação de moeda</text></svg>