6 H4 Z M8 10 H16 M8 13 H13"/></g><text x="66" y="301" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Customer insights</text><rect x="12" y="324" width="208" height="46" rx="8" fill="#2E4E78"/><rect x="12" y="335" width="3" height="24" rx="1.5" fill="#A6824C"/><g transform="translate(30,335) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L5 13 H11 L10 22 L19 10 H13 Z"/></g><text x="66" y="353" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="1.0">Recomendações</text><g transform="translate(30,387) scale(0.9167)" fill="none" stroke="#C9D2DE" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 H15 L19 7 V21 H6 Z M15 3 V7 H19 M9 12 H16 M9 16 H16"/></g><text x="66" y="405" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#C9D2DE" text-anchor="start" opacity="1.0">Fontes e premissas</text><rect x="232" y="0" width="1688" height="104" fill="#FBFAF7"/><rect x="232" y="103" width="1688" height="1" fill="#DAD4C8"/><text x="260" y="46" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#1F3A5F" text-anchor="start" opacity="1.0">Recomendações</text><text x="260" y="72" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Seis decisões: o que fazer, por quê, e o número que sustenta</text><rect x="1688.6" y="34" width="203.4" height="30" rx="15" fill="#E7E2D9" stroke="#DAD4C8"/><text x="1790.3" y="54" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#5C5A54" text-anchor="middle" opacity="1.0">leitura de cima para baixo</text><rect x="260.0" y="150" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="299.0" cy="183" r="15" fill="#1F3A5F"/><text x="299.0" y="188" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">1</text><text x="326.0" y="188" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Concentrar o sortimento em vez de diversificar</text><rect x="284.0" y="210" width="758.0" height="1" fill="#DAD4C8"/><text x="284.0" y="236" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="284.0" y="256" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Três categorias concentram quase todo o catálogo. Abrir frentes novas dilui atenção onde já existe</text><text x="284.0" y="272" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">escala.</text><text x="284.0" y="356" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="284.0" y="374" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">1.313 de 1.351, ou 97,2%</text><rect x="806.0" y="224" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="806.0" y="236" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="924.0" y="322.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">produtos nas 3 maiores categorias de</text><text x="924.0" y="335.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">nível 1</text><rect x="806.0" y="378" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="924.0" y="398" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Visão executiva</text><rect x="1086.0" y="150" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="1125.0" cy="183" r="15" fill="#1F3A5F"/><text x="1125.0" y="188" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">2</text><text x="1152.0" y="188" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Parar de usar desconto para comprar avaliação</text><rect x="1110.0" y="210" width="758.0" height="1" fill="#DAD4C8"/><text x="1110.0" y="236" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="1110.0" y="256" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Desconto maior não traz mais avaliação e vem com nota levemente pior. O efeito é pequeno, mas</text><text x="1110.0" y="272" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">é na direção contrária da intuição.</text><text x="1110.0" y="356" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="1110.0" y="374" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">queda de 0,14 ponto: 4,16 na faixa até 20% contra 4,01 na de 80% ou mais. Correlação desconto x nota</text><text x="1110.0" y="388" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">-0,16, desconto x avaliações +0,00</text><rect x="1632.0" y="224" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="1632.0" y="236" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="1750.0" y="322.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">queda da nota ponderada da menor para a</text><text x="1750.0" y="335.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">maior faixa de desconto</text><rect x="1632.0" y="378" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="1750.0" y="398" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Preços e descontos</text><rect x="260.0" y="451" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="299.0" cy="484" r="15" fill="#1F3A5F"/><text x="299.0" y="489" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">3</text><text x="326.0" y="489" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Investigar os produtos muito avaliados com nota baixa</text><rect x="284.0" y="511" width="758.0" height="1" fill="#DAD4C8"/><text x="284.0" y="537" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="284.0" y="557" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">São produtos que já têm tráfego e estão decepcionando. Cada um deles converte visita em</text><text x="284.0" y="573" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">avaliação ruim.</text><text x="284.0" y="657" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="284.0" y="675" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">112 produtos, rating_count &gt;= 4.740 e nota &lt;= 3,9</text><rect x="806.0" y="525" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="806.0" y="537" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="924.0" y="623.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">produtos com nº de avaliações acima da</text><text x="924.0" y="636.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">mediana e nota no quartil inferior</text><rect x="806.0" y="679" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="924.0" y="699" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Visão executiva</text><rect x="1086.0" y="451" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="1125.0" cy="484" r="15" fill="#1F3A5F"/><text x="1125.0" y="489" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">4</text><text x="1152.0" y="489" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Dar visibilidade ao que já é bem avaliado e ninguém vê</text><rect x="1110.0" y="511" width="758.0" height="1" fill="#DAD4C8"/><text x="1110.0" y="537" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="1110.0" y="557" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Produto com nota alta e pouca avaliação é estoque de reputação parado. Custa menos promover do</text><text x="1110.0" y="573" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">que consertar.</text><text x="1110.0" y="657" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="1110.0" y="675" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">76 produtos, nota &gt;= 4,3 e rating_count &lt; 1.000</text><rect x="1632.0" y="525" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="1632.0" y="537" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="1750.0" y="623.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">produtos com nota no quartil superior e</text><text x="1750.0" y="636.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">menos de mil avaliações</text><rect x="1632.0" y="679" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="1750.0" y="699" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Visão executiva</text><rect x="260.0" y="752" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="299.0" cy="785" r="15" fill="#1F3A5F"/><text x="299.0" y="790" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">5</text><text x="326.0" y="790" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Atacar ruído, bateria e material antes de preço</text><rect x="284.0" y="812" width="758.0" height="1" fill="#DAD4C8"/><text x="284.0" y="838" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="284.0" y="858" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Os termos que mais separam o produto mal avaliado do bem avaliado são de qualidade física, não</text><text x="284.0" y="874" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">de preço.</text><text x="284.0" y="958" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="284.0" y="976" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">average +13,8 · bad +13,2 · noise +9,9 · battery +8,8 · bass +8,6</text><rect x="806.0" y="826" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="806.0" y="838" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="924.0" y="924.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">o quanto 'noise' aparece mais em quem</text><text x="924.0" y="937.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">reclama, em pontos percentuais</text><rect x="806.0" y="980" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="924.0" y="1000" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Customer insights</text><rect x="1086.0" y="752" width="806.0" height="281" rx="10" fill="#FBFAF7" stroke="#DAD4C8"/><circle cx="1125.0" cy="785" r="15" fill="#1F3A5F"/><text x="1125.0" y="790" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">6</text><text x="1152.0" y="790" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">Tratar preço como alavanca de margem, não de satisfação</text><rect x="1110.0" y="812" width="758.0" height="1" fill="#DAD4C8"/><text x="1110.0" y="838" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">POR QUÊ</text><text x="1110.0" y="858" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">A nota ponderada é praticamente plana entre as faixas de preço. Quem compra barato não está</text><text x="1110.0" y="874" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">mais insatisfeito.</text><text x="1110.0" y="958" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9.5" font-weight="700" fill="#8A877E" text-anchor="start" opacity="1.0">BASE DO NÚMERO</text><text x="1110.0" y="976" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">amplitude de 0,10 ponto: de 4,113 a 4,216 nas seis faixas. OfficeProducts tem o menor desconto e a maior</text><text x="1110.0" y="990" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">nota</text><rect x="1632.0" y="826" width="236.0" height="140" rx="8" fill="#E7E2D9"/><rect x="1632.0" y="838" width="3" height="116" rx="1.5" fill="#A6824C"/><text x="1750.0" y="924.0" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">amplitude da nota ponderada entre as seis</text><text x="1750.0" y="937.5" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#5C5A54" text-anchor="middle" opacity="1.0">faixas de preço</text><rect x="1632.0" y="980" width="236.0" height="30" rx="8" fill="#E7E2D9" stroke="#A6824C"/><text x="1750.0" y="1000" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#A6824C" text-anchor="middle" opacity="1.0">conferir em Preços e descontos</text><text x="260" y="1062" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">Decisão e justificativa são interpretação nossa sobre a análise. O número de cada bloco é medida do modelo e acompanha o filtro.</text></svg>