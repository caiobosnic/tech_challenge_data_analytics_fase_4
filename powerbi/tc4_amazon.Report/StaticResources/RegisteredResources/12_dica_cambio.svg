<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect x="0" y="0" width="400" height="300" fill="#FBFAF7"/><rect x="0" y="0" width="400" height="5" fill="#1F3A5F"/><text x="20" y="36" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1F3A5F" text-anchor="start" opacity="1.0">A conversão é premissa, não cotação</text><rect x="20" y="58" width="360" height="1" fill="#DAD4C8"/><text x="20" y="80" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">A base só traz rupia indiana e não traz câmbio. A taxa é fixa, declarada</text><text x="20" y="95" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">na tabela dMoeda, e serve para ordem de grandeza. Não serve para fechar</text><text x="20" y="110" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">operação.</text><text x="20" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2E6BA8" text-anchor="start" opacity="1.0">TAXA POR RUPIA</text><rect x="18" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><text x="208" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#A6824C" text-anchor="start" opacity="1.0">PREÇO MÉDIO</text><rect x="206" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><rect x="20" y="240" width="360" height="1" fill="#DAD4C8"/><text x="20" y="262" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">a data e a fonte da taxa estão em Fontes e premissas</text></svg>