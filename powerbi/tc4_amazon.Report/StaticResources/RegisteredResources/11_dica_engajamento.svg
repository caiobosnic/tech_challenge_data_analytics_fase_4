<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect x="0" y="0" width="400" height="300" fill="#FBFAF7"/><rect x="0" y="0" width="400" height="5" fill="#1F3A5F"/><rect x="16" y="18" width="368" height="44" rx="6" fill="#E7E2D9"/><rect x="20" y="70" width="360" height="1" fill="#DAD4C8"/><text x="20" y="92" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">Faixa definida pelos quartis de rating_count desta base, não por corte</text><text x="20" y="107" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5C5A54" text-anchor="start" opacity="1.0">redondo. A nota é ponderada dentro da faixa.</text><text x="20" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2E6BA8" text-anchor="start" opacity="1.0">PRODUTOS NA FAIXA</text><rect x="18" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><text x="208" y="164" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#A6824C" text-anchor="start" opacity="1.0">NOTA PONDERADA</text><rect x="206" y="172" width="176" height="46" rx="6" fill="#E7E2D9"/><rect x="20" y="240" width="360" height="1" fill="#DAD4C8"/><text x="20" y="262" font-family="Carlito, Calibri, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#8A877E" text-anchor="start" opacity="1.0">passe por outra barra para comparar as faixas</text></svg>